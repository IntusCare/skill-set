# https://docs.devin.ai/onboard-devin/environment-yaml
# Commands run from the repo root.
# PRIMARY_REPO / start-every-shell-in-the-repo behaviour is provided by the org-level blueprint, which runs before this one.
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  git submodule update --init --recursive
  bun install
# Reference info for agent
knowledge:
  - name: build
    contents: |
      bun run build
  - name: test
    contents: |
      bun run test
  - name: typecheck
    contents: |
      bun run typecheck
